[workspace]
channels = ["https://repo.prefix.dev/econforge", "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tasks]
lab = "jupyter lab"
watch = "jlpm watch & jupyter lab"

[dependencies]
jupyterlab = ">=4.0.0,<5"
jupyterlab-dyno = { path = "." }
dyno = { path = "../dyno.py" }
nodejs = ">=24.4.0,<24.5"


[package]
name = "jupyterlab-dyno"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }
build-number = 0

[package.build.config]
noarch = true

[package.host-dependencies] 
hatchling = ">=1.5.0"
hatch-nodejs-version = ">=0.3.2"
hatch-jupyter-builder = ">=0.5.0"
nodejs = ">=24.4.0,<24.5"
jupyterlab = ">=4.0.0,<5"

[package.run-dependencies]
dyno = ">=0.1.10"
xeus-python = ">=0.19"
