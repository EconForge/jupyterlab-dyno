[workspace]
channels = ["https://repo.prefix.dev/econforge", "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tasks]
lab = "jupyter lab"
watch = "jlpm watch & jupyter lab"

[dependencies]
jupyterlab = ">=4.0.0,<5"
jupyterlab-dyno = { path = "." }
nodejs = ">=24.4.0,<24.5"
jupyterlab-myst = ">=2.4.2,<3"


[package]
name = "jupyterlab-dyno"
version = "0.0.3.5"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.host-dependencies] 
hatchling = ">=1.5.0"
hatch-nodejs-version = ">=0.3.2"
hatch-jupyter-builder = ">=0.5.0"
nodejs = ">=24.4.0,<24.5"
jupyterlab = ">=4.0.0,<5"

[package.run-dependencies]
dyno = ">=0.1.8"
xeus-python = ">=0.18"
nlohmann_json = "==3.12"
